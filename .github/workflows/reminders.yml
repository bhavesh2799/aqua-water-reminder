name: Water reminders

on:
  # Started every 10 minutes by a Google Apps Script timer (see apps-script/Timer.gs),
  # because GitHub's own schedule never fired reliably for this repo.
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      test:
        description: "Send a test notification to everyone right now"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: reminders } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: reminders/package-lock.json }
      - run: npm ci --omit=dev
      - run: node send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_TEST: ${{ inputs.test || false }}
